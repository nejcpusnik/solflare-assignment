name: API tests

on:
  push:
  pull_request:
  # The tests run against the live API, so a daily run also catches changes on Solflare's side.
  schedule:
    - cron: '0 6 * * *'
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # The API tests need no browser, so there is no "playwright install" step.
      - run: npm ci
      - run: npm test

      # Keep the HTML report, also when tests fail, so a failure can be analysed later.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: api/playwright-report/
          retention-days: 14
